[project]
name = "foxygram-server"
version = "0.1.0"
description = "Always-on companion server for FoxyGram"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "segno>=1.6",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
foxygram-server = "foxygram.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foxygram"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
