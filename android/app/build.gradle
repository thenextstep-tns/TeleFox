plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.telefox.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.telefox.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        python {
            version "3.8"
            buildPython "C:/Users/Lenovo/AppData/Local/Programs/Python/Python38/python.exe"
            pip {
                install "telethon"
                install "pymongo"
                install "motor"
                install "pydantic==1.10.13"
                install "fastapi==0.95.2"
                install "uvicorn"
                install "python-dotenv"
                install "aiohttp"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}
