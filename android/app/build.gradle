plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.telefox.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.telefox.app"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.2.1"

        ndk {
            abiFilters "arm64-v8a"
        }

        python {
            version "3.8"
            buildPython "C:/Users/Lenovo/AppData/Local/Programs/Python/Python38/python.exe"
            pip {
                install "telethon"
                install "pymongo>=4.9,<4.10"
                install "motor"
                install "pydantic==1.10.13"
                install "fastapi==0.95.2"
                install "uvicorn"
                install "python-dotenv"
                install "aiohttp"
            }
        }
    }

    buildTypes {
        release {
            // Signed with the existing debug key so it installs over the current app,
            // but not debuggable (debuggable builds are a Play Protect red flag).
            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The Python sources live once, in the repository root. Mirror them into the
// directory Chaquopy packages, so the PC and Android copies can't drift apart.
tasks.register('syncPython', Sync) {
    from(rootProject.projectDir.parentFile) {
        include '*.py', 'web/**', '.env', 'accounts.json', 'rules.json',
                'projects_cache.json', 'categories_cache.json'
        exclude 'scratch_*.py', 'web/*.apk', 'web/*.tar.gz', 'web/telefox_qr.png'
    }
    into 'src/main/python'
}
tasks.configureEach { task ->
    if (task.name != 'syncPython' && (task.name == 'preBuild' || task.name.endsWith('PythonSources'))) {
        task.dependsOn 'syncPython'
    }
}

dependencies {
}
