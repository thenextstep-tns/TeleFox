plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.telefox.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.telefox.app"
        minSdk 24
        targetSdk 34
        versionCode = Integer.parseInt((project.findProperty("appVersionCode") ?: "4").toString())
        versionName = (project.findProperty("appVersionName") ?: "1.2.1").toString()

        ndk {
            abiFilters "arm64-v8a"
        }

        python {
            version "3.8"
            buildPython((project.findProperty("buildPython") ?: "C:/Users/Lenovo/AppData/Local/Programs/Python/Python38/python.exe").toString())
            pip {
                install "telethon"
                install "pymongo>=4.9,<4.10"
                install "motor"
                install "pydantic==1.10.13"
                install "fastapi==0.95.2"
                install "uvicorn"
                install "python-dotenv"
                install "aiohttp"
            }
        }
    }

    signingConfigs {
        // The installed app is signed with the debug key, so releases must be too (updates are
        // only accepted when the signature matches). CI restores that key and points here.
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            // Signed with the existing debug key (see signingConfigs) so it installs over the current app,
            // but not debuggable (debuggable builds are a Play Protect red flag).
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The Python sources live once, in the repository root. Mirror them into the
// directory Chaquopy packages, so the PC and Android copies can't drift apart.
tasks.register('syncPython', Sync) {
    from(rootProject.projectDir.parentFile) {
        include '*.py', 'web/**', '.env', 'accounts.json', 'rules.json',
                'projects_cache.json', 'categories_cache.json'
        exclude 'scratch_*.py', 'web/*.apk', 'web/*.tar.gz', 'web/telefox_qr.png'
    }
    into 'src/main/python'
}
tasks.configureEach { task ->
    if (task.name != 'syncPython' && (task.name == 'preBuild' || task.name.endsWith('PythonSources'))) {
        task.dependsOn 'syncPython'
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}
