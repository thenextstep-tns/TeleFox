name: Build and release APK

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'n8n/**']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Releases are numbered from the run counter so every push is strictly newer than the last.
  VERSION_MAJOR_MINOR: "1.3"
  VERSION_CODE_OFFSET: 100

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner image already ships the Android SDK (ANDROID_HOME).

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      # The installed app is signed with this key; updates only install if the signature matches.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Build release APK
        run: |
          VERSION="${VERSION_MAJOR_MINOR}.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          gradle -p android :app:assembleRelease \
            -PappVersionName="$VERSION" \
            -PappVersionCode=$((VERSION_CODE_OFFSET + GITHUB_RUN_NUMBER)) \
            -PbuildPython="$(which python)"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk TeleFox.apk
          git log -1 --format=%B > notes.txt
          gh release create "v${VERSION}" TeleFox.apk \
            --title "TeleFox ${VERSION}" --notes-file notes.txt
